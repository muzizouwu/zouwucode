[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zouwucode"
version = "1.15.0"
description = "ZOUWUCODE - DeepSeek-native AI Coding Agent for your terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "走戊工作室 (Zouwu Studio)"},
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
tui = [
    "textual>=1.0.0",
]
gui = [
    "pywebview>=5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "textual>=1.0.0",
]

[project.scripts]
zouwucode = "zouwucode.__main__:main"

[tool.setuptools.packages.find]
# "zouwucode*" also matched the runtime data dir (zouwucode_data/), so it was
# installed as a namespace package. List the real packages explicitly.
include = [
    "zouwucode",
    "zouwucode.*",
    "hello_my_zouwucode",
    "hello_my_zouwucode.*",
]

[tool.setuptools.package-data]
"zouwucode.eval" = ["tasks/*.yaml"]
"zouwucode.tui" = ["*.tcss"]
"zouwucode.webui" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]